<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twain</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <script src="script.js" defer></script>
  </head>

  <body class="game-page">
    <main class="container-fluid p-4">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Lets-a-go</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"
                  >[Home]</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">[About me]</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="game.html">[Play the game]</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="row">
        <div class="col-12">
          <div class="highlight text-center">
            <header class="heading">
              <h1 id="scene-title"></h1>
            </header>
          </div>
        </div>
      </div>

      <!-- Main game grid -->
      <div class="row mt-4">
        <!-- Dialogue column -->
        <div class="col-lg-8 mb-4">
          <h2 id="character-name" class="fst-italic fw-normal"></h2>

          <section class="py-4">
            <p id="scene-text"></p>

            <p id="child-text" class="story-card p-3"></p>
          </section>

          <!-- Choices -->
          <section class="mt-3">
            <div id="choices-container"></div>
          </section>
        </div>

        <!-- Inventory sidebar -->
        <div class="col-lg-4 mb-4">
          <section id="rooms" class="p-3 fs-5 fst-italic">
            <p>
              Rooms visited:
              <span id="rooms-display">0</span>
            </p>

            <img src="rooms.png" width="50" alt="Rooms" />

            <p class="mt-3">Inventory:</p>

            <ul>
              <li id="inventory-display"></li>
            </ul>

            <p id="message-display"></p>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
